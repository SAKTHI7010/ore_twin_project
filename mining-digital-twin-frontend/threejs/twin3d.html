<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>3D Digital Twin – Ore Beneficiation Plant</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0F172A; overflow:hidden; font-family:'Segoe UI',sans-serif; }
  canvas { display:block; }
  #info {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(15,23,42,0.85); color:#F1F5F9; padding:8px 18px;
    border-radius:6px; font-size:13px; border:1px solid #334155;
    backdrop-filter:blur(6px);
  }
  #tooltip {
    position:absolute; display:none; background:rgba(15,23,42,0.95);
    border:1px solid #F97316; border-radius:8px; padding:12px 16px;
    color:#F1F5F9; font-size:12px; max-width:240px; pointer-events:none;
    backdrop-filter:blur(8px);
  }
  #tooltip h4 { color:#F97316; margin-bottom:6px; font-size:14px; }
  #tooltip .row { display:flex; justify-content:space-between; gap:16px; margin:2px 0; }
  #tooltip .key { color:#94A3B8; }
  #tooltip .val { color:#F1F5F9; font-weight:600; }
  #legend {
    position:absolute; bottom:12px; left:12px;
    background:rgba(15,23,42,0.85); border:1px solid #334155;
    border-radius:8px; padding:10px 14px; color:#F1F5F9; font-size:11px;
  }
  #legend h5 { color:#94A3B8; margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
  .leg-row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .leg-dot { width:10px; height:10px; border-radius:2px; }
  #mode-badge {
    position:absolute; top:10px; right:12px;
    background:#1E40AF; color:#93C5FD; padding:4px 10px;
    border-radius:4px; font-size:11px; font-weight:700; letter-spacing:.05em;
  }
</style>
</head>
<body>
<div id="info">🏭 Ore Beneficiation Digital Twin — Click equipment to inspect | Drag to rotate | Scroll to zoom</div>
<div id="mode-badge">🟡 DEMO / SIMULATION</div>
<div id="tooltip"></div>
<div id="legend">
  <h5>Equipment Status</h5>
  <div class="leg-row"><div class="leg-dot" style="background:#22C55E"></div>Running</div>
  <div class="leg-row"><div class="leg-dot" style="background:#38BDF8"></div>Simulation</div>
  <div class="leg-row"><div class="leg-dot" style="background:#F59E0B"></div>Warning</div>
  <div class="leg-row"><div class="leg-dot" style="background:#EF4444"></div>Fault</div>
  <div class="leg-row"><div class="leg-dot" style="background:#94A3B8"></div>Idle</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ─── Scene Setup ──────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0F172A);
scene.fog = new THREE.Fog(0x0F172A, 80, 180);

const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 500);
camera.position.set(0, 35, 55);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;

// ─── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x94A3B8, 0.6));
const sun = new THREE.DirectionalLight(0xFFF7ED, 1.4);
sun.position.set(30, 60, 40);
sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x38BDF8, 0.4);
fill.position.set(-30, 20, -20);
scene.add(fill);

// ─── Floor Grid ───────────────────────────────────────────────────────────────
const grid = new THREE.GridHelper(120, 30, 0x1E293B, 0x1E293B);
scene.add(grid);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshLambertMaterial({ color: 0x0F172A })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

// ─── Status colors ────────────────────────────────────────────────────────────
const STATUS_COLORS = {
  RUNNING: 0x22C55E, IDLE: 0x94A3B8, WARNING: 0xF59E0B,
  FAULT: 0xEF4444, SIMULATION: 0x38BDF8
};

// ─── Equipment Definitions ────────────────────────────────────────────────────
// Each entry: id, label, position [x,y,z], geometry type, dims
const EQUIPMENT = [
  { id:'CR-001', label:'Primary Jaw Crusher',           pos:[-28, 2, -20], type:'box',      dims:[5,4,4],  status:'SIMULATION' },
  { id:'SC-001', label:'Primary Vibrating Screen',      pos:[-16, 2, -14], type:'box',      dims:[6,1.5,3],status:'SIMULATION' },
  { id:'CR-002', label:'Secondary Cone Crusher',        pos:[-6,  2.5,-20],type:'cylinder', dims:[2,5,2],  status:'SIMULATION' },
  { id:'RS-001', label:'Rotary Scrubber',               pos:[-6,  2, -8],  type:'cylinder', dims:[2,8,2],  status:'SIMULATION' },
  { id:'JG-001', label:'Jig Concentrator 1',            pos:[ 5,  1.5,-14],type:'box',      dims:[4,3,3],  status:'SIMULATION' },
  { id:'SP-001', label:'Spiral Classifier',             pos:[14,  2, -20], type:'cylinder', dims:[1.5,6,1.5],status:'SIMULATION' },
  { id:'HC-001', label:'Hydrocyclone Cluster',          pos:[22,  3, -14], type:'cone',     dims:[2,6,2],  status:'SIMULATION' },
  { id:'WHIMS-001',label:'Wet HI Magnetic Separator',   pos:[28,  2,  -5], type:'box',      dims:[5,3,4],  status:'SIMULATION' },
  { id:'CR-003', label:'Tertiary VSI Crusher',          pos:[16,  2,   4], type:'cylinder', dims:[2,4,2],  status:'SIMULATION' },
  { id:'SC-002', label:'Tertiary Vibrating Screen',     pos:[ 6,  1.5,  10],type:'box',     dims:[5,1.5,3],status:'SIMULATION' },
  { id:'JG-002', label:'Jig Concentrator 2',            pos:[-4,  1.5, 10], type:'box',     dims:[4,3,3],  status:'SIMULATION' },
  { id:'TB-001', label:'Shaking Water Table',           pos:[-14, 1.5, 16], type:'box',     dims:[5,1,3],  status:'SIMULATION' },
];

// ─── Stream connections [source, dest] ────────────────────────────────────────
const STREAMS = [
  ['CR-001','SC-001'],['SC-001','CR-002'],['SC-001','RS-001'],
  ['CR-002','RS-001'],['RS-001','JG-001'],['JG-001','SP-001'],
  ['SP-001','HC-001'],['HC-001','WHIMS-001'],['WHIMS-001','CR-003'],
  ['CR-003','SC-002'],['SC-002','JG-002'],['JG-002','TB-001'],
];

const equip3d = {}; // id -> mesh
const tooltip = document.getElementById('tooltip');

function makeEquipMesh(eq) {
  const color = STATUS_COLORS[eq.status] || 0x38BDF8;
  const mat = new THREE.MeshPhongMaterial({ color, shininess: 80, specular: 0xFFFFFF });
  let geo;
  if (eq.type === 'cylinder') {
    geo = new THREE.CylinderGeometry(eq.dims[0], eq.dims[2], eq.dims[1], 16);
  } else if (eq.type === 'cone') {
    geo = new THREE.ConeGeometry(eq.dims[0], eq.dims[1], 16);
  } else {
    geo = new THREE.BoxGeometry(...eq.dims);
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...eq.pos);
  mesh.castShadow = true;
  mesh.userData = { ...eq };

  // Glow ring
  const ringGeo = new THREE.TorusGeometry(eq.dims[0] * 1.3 + 0.5, 0.12, 8, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -eq.dims[1] / 2 + 0.1;
  mesh.add(ring);

  return mesh;
}

// Build equipment meshes
EQUIPMENT.forEach(eq => {
  const m = makeEquipMesh(eq);
  scene.add(m);
  equip3d[eq.id] = m;
});

// ─── Stream pipes ─────────────────────────────────────────────────────────────
function makePipe(fromMesh, toMesh) {
  const a = fromMesh.position.clone();
  const b = toMesh.position.clone();
  a.y += 1; b.y += 1;
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(0.15, 0.15, len, 8);
  const mat = new THREE.MeshPhongMaterial({ color: 0xF97316, transparent: true, opacity: 0.7 });
  const pipe = new THREE.Mesh(geo, mat);
  pipe.position.copy(mid);
  pipe.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return pipe;
}

STREAMS.forEach(([sid, did]) => {
  if (equip3d[sid] && equip3d[did]) {
    scene.add(makePipe(equip3d[sid], equip3d[did]));
  }
});

// ─── Flow particles ───────────────────────────────────────────────────────────
const particleGroups = [];
STREAMS.forEach(([sid, did]) => {
  if (!equip3d[sid] || !equip3d[did]) return;
  const a = equip3d[sid].position.clone().setY(1.5);
  const b = equip3d[did].position.clone().setY(1.5);
  const count = 5;
  const particles = [];
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.18, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0xFBBF24 });
    const p = new THREE.Mesh(geo, mat);
    p.userData.t = i / count;
    scene.add(p);
    particles.push(p);
  }
  particleGroups.push({ a, b, particles });
});

// ─── Raycasting for hover/click ───────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const equipMeshes = EQUIPMENT.map(e => equip3d[e.id]);

function showTooltip(eq, x, y) {
  tooltip.style.display = 'block';
  tooltip.style.left = (x + 16) + 'px';
  tooltip.style.top = (y - 16) + 'px';
  tooltip.innerHTML = `
    <h4>⚙️ ${eq.label}</h4>
    <div class="row"><span class="key">ID</span><span class="val">${eq.id}</span></div>
    <div class="row"><span class="key">Type</span><span class="val">${eq.id.split('-')[0]}</span></div>
    <div class="row"><span class="key">Status</span><span class="val" style="color:#38BDF8">${eq.status}</span></div>
    <div class="row"><span class="key">Mode</span><span class="val" style="color:#FBBF24">DEMO</span></div>
    <div style="color:#94A3B8;font-size:10px;margin-top:6px">Click to inspect in Equipment Details panel</div>
  `;
}

window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(equipMeshes, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !obj.userData.id) obj = obj.parent;
    if (obj.userData.id) {
      showTooltip(obj.userData, e.clientX, e.clientY);
      document.body.style.cursor = 'pointer';
      return;
    }
  }
  tooltip.style.display = 'none';
  document.body.style.cursor = 'default';
});

window.addEventListener('click', e => {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(equipMeshes, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !obj.userData.id) obj = obj.parent;
    if (obj.userData.id) {
      // Post message to Streamlit parent if embedded
      if (window.parent) {
        window.parent.postMessage({ type: 'equipment_click', id: obj.userData.id }, '*');
      }
    }
  }
});

// ─── Dynamic data update from parent Streamlit ────────────────────────────────
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'equipment_states') {
    const states = e.data.states;
    EQUIPMENT.forEach(eq => {
      const m = equip3d[eq.id];
      const s = states[eq.id];
      if (m && s) {
        const col = STATUS_COLORS[s.status] || 0x38BDF8;
        m.material.color.setHex(col);
        m.userData.status = s.status;
        m.userData.label = s.name || eq.label;
      }
    });
  }
});

// ─── Animation loop ───────────────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;
  controls.update();

  // Animate flow particles
  particleGroups.forEach(g => {
    g.particles.forEach(p => {
      p.userData.t = (p.userData.t + 0.004) % 1;
      const frac = p.userData.t;
      p.position.lerpVectors(g.a, g.b, frac);
      p.position.y += Math.sin(frac * Math.PI) * 0.3;
    });
  });

  // Pulse equipment rings
  equipMeshes.forEach((m, i) => {
    if (m.children[0]) {
      m.children[0].material.opacity = 0.3 + 0.3 * Math.sin(t * 2 + i);
    }
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
